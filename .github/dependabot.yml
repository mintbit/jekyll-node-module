version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    groups:
      ruby-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
